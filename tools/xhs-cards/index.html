<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书卡片 · 在线工具箱</title>
</head>
<body>
<header class="site-head"><div class="inner">
  <a class="brand" href="/">← 在线工具箱</a>
  <p class="tagline">📕 小红书卡片</p>
</div></header>
<main class="wrap">
  <section class="card">
    <h2>选择日期</h2>
    <p class="hint">
      卡片随日报<strong>每天 07:00 自动生成</strong>,与当天日报是同一批选稿。
      直接选日期下载即可,不需要密钥。产物保留 7 天。
    </p>
    <div class="row">
      <select id="date"></select>
      <button id="reload" type="button" class="ghost">刷新列表</button>
    </div>
    <p id="status" class="hint"></p>
  </section>

  <section id="result" class="card" hidden>
    <h2>结果</h2>
    <p id="summary" class="hint"></p>
    <div class="row">
      <button id="save" type="button">保存到相册</button>
      <button id="zip" type="button" class="ghost">打包下载 ZIP</button>
    </div>
    <p class="hint">
      手机上点「保存到相册」会打开系统分享面板,选<strong>存储图像</strong>即可一次存多张;
      也可以直接<strong>长按某张图</strong>保存。ZIP 只适合电脑。
    </p>
    <div id="grid" class="grid"></div>
  </section>

  <section class="card">
    <h2>重新生成</h2>
    <p class="hint">
      只有想强制重做某一天时才需要(例如日报缓存刚补了手工新闻)。
      需要访问密钥,点完就清空。
    </p>
    <div class="row">
      <input id="key" type="password" placeholder="访问密钥"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="regen" type="button" class="ghost">重新生成所选日期</button>
    </div>
  </section>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
