<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 登录地址 · 在线工具箱</title>
</head>
<body>
<header class="site-head"><div class="inner">
  <a class="brand" href="/">← 在线工具箱</a>
  <p class="tagline">🔑 DSH 登录地址</p>
</div></header>

<main class="wrap">
  <section class="card">
    <h2>获取当前登录地址</h2>
    <p class="hint">
      该地址里的 token 是 <b>DSH 的进程级登录凭据</b>(DSH 以 root 运行),
      等同于机器的高权限入口 —— 请勿分享、勿截图外发。token 每次重启 dsh 都会变。
    </p>

    <div class="row" style="margin-top:12px">
      <input id="keyInput" type="password" placeholder="访问密钥(每次获取都需输入)"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="fetch" class="primary">显示 DSH 登录地址</button>
    </div>
    <p class="hint">密钥不会被保存:不写本机存储,请求结束即清空输入框。</p>

    <p class="status" id="status"></p>
  </section>

  <section class="card" id="resultCard" hidden>
    <h2>登录地址 <span class="count" id="validBadge"></span></h2>
    <div class="url-box"><code id="urlText"></code></div>
    <div class="row" style="margin-top:12px">
      <button id="reveal">显示完整地址</button>
      <button id="copy" class="primary">复制</button>
      <button id="open">直接打开</button>
    </div>
    <p class="hint" id="meta"></p>
    <p class="warn" id="warn" hidden></p>
  </section>
</main>

<script type="module" src="./main.ts"></script>
</body>
</html>
