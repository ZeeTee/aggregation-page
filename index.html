<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线工具箱</title>
<meta name="description" content="一个自托管的小工具集合页">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <p class="hero-sub" id="tagline"></p>
    <div class="hero-search">
      <input id="q" class="search" type="search" placeholder="搜索工具(按 / 聚焦)…" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tags" id="tags"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>没有匹配的工具。</p>
  <p class="hint" style="text-align:center">提示:按 <kbd>/</kbd> 快速搜索</p>
</main>

<footer class="site-foot" id="foot"></footer>

<script type="module" src="/src/hub/main.ts"></script>
</body>
</html>
